{% extends 'base.html' %}
{% block title %}Suppliers{% endblock %}
{% block content %}
<div class="container py-4"><div class="d-flex justify-content-between mb-3"><h2>Suppliers</h2><a class="btn btn-primary" href="{% url 'supplier_add' %}">+ Add Supplier</a></div>
<div class="card"><div class="card-body table-responsive"><table class="table"><tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th></tr>
{% for s in suppliers %}<tr><td>{{ s.name }}</td><td>{{ s.phone }}</td><td>{{ s.email }}</td><td>{{ s.address }}</td></tr>{% empty %}<tr><td colspan="4">No suppliers.</td></tr>{% endfor %}</table></div></div></div>
{% endblock %}
