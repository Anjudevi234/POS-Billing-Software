{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}POS Billing{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{% if request.user.is_authenticated %}{% url 'dashboard' %}{% else %}/{% endif %}">POS Billing</a>
    {% if request.user.is_authenticated %}
    <div class="d-flex align-items-center gap-2">
      <span class="text-white small">{{ request.user.username }}</span>
      <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">Logout</a>
    </div>
    {% endif %}
  </div>
</nav>

{% if messages %}
<div class="container mt-3">
{% for message in messages %}
<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
{% endfor %}
</div>
{% endif %}

{% block content %}{% endblock %}
</body>
</html>
